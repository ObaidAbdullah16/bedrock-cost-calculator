# Publishes site/ to GitHub Pages: https://<owner>.github.io/bedrock-cost-calculator/
# Optional repository variables: PORTFOLIO_URL (where "See the service" points).
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Point the call-to-action at the portfolio
        env:
          PORTFOLIO_URL: ${{ vars.PORTFOLIO_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p _site && cp -r site/. _site/
          cta="${PORTFOLIO_URL:-https://github.com/${GITHUB_REPOSITORY_OWNER}}"
          [ -n "$PORTFOLIO_URL" ] && cta="${PORTFOLIO_URL%/}/#s6"
          python3 - "$cta" "$REPO_URL" <<'PY'
          import json, re, sys
          p = "_site/config.js"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'ctaUrl: "[^"]*"', "ctaUrl: " + json.dumps(sys.argv[1]), s)
          s = re.sub(r'repoUrl: "[^"]*"', "repoUrl: " + json.dumps(sys.argv[2]), s)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
